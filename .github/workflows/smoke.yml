name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"   # matches the dev clone; the pipeline needs only 3.10 or newer
      - name: Install pdftotext (poppler)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Pipeline smoke (packaging + logic contract + offline end-to-end)
        run: python skills/hallucite/scripts/tests/run_smoke.py
      - name: Markdown lint
        run: |
          rc=0
          for f in $(git ls-files '*.md' | grep -vE '/_vendor/|/bundled_licenses/'); do
            python skills/hallucite/scripts/lint_markdown.py "$f" || rc=1
          done
          exit $rc
