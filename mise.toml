# mise config for the hallucite reference-audit pipeline (https://mise.jdx.dev).
#
# This repo is both the runnable project (these tasks) and a Claude Code/Codex CLI plugin. Run
# mise tasks from the repo root. Layout:
#
#   hallucite/                  # repo root (also the shared plugin tree)
#   ├── mise.toml  requirements.txt
#   ├── .claude-plugin/         # Claude Code plugin.json + marketplace.json
#   ├── .codex-plugin/          # Codex CLI plugin.json
#   ├── .agents/                # Codex CLI marketplace + repo-local skill shim
#   ├── skills/hallucite/
#   │   ├── SKILL.md
#   │   └── scripts/            # pdf_references, audit_references, triage
#   └── out/                    # (gitignored) per-paper JSON, summary.json, reports/
#
# The offline DBLP DB defaults to ~/hallucite/dblp.db, outside the repo (it is large and not
# committed); override the location with $HALLUCITE_DBLP. `audit` checks the database's age at
# run time and warns when it is out of date.

[tools]
# hallucinator publishes wheels for CPython 3.12; pinning here avoids a
# from-source build (Rust + maturin) that 3.13 would trigger.
python = "3.12"
uv = "latest"

[env]
# Auto-create and activate the repo's .venv whenever mise loads this dir.
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install Python dependencies into the venv"
run = "uv pip install -r requirements.txt"

[tasks.upgrade]
# The repo venv and the plugin's managed venv are separate installs, so upgrade both: a dev clone
# that only bumps .venv keeps auditing through whichever one run.sh resolves. Neither updates
# itself -- see the note at the top of skills/hallucite/scripts/run.sh.
description = "Upgrade hallucinator in the repo venv and in run.sh's managed venv"
run = """
set -euo pipefail
uv pip install --upgrade hallucinator
skills/hallucite/scripts/run.sh upgrade
"""

[tasks.install-cli]
description = "Download the hallucinator CLI prebuilt binary into .bin/ (checksum-verified, no curl|sh)"
run = """
set -euo pipefail
os=$(uname -s); [ "$os" = "Darwin" ] || { echo "install-cli fetches macOS (Darwin) binaries only; on $os install with 'cargo install hallucinator-cli' or download from the releases page" >&2; exit 1; }
arch=$(uname -m); case "$arch" in arm64|aarch64) tgt=aarch64-apple-darwin ;; x86_64) tgt=x86_64-apple-darwin ;; *) echo "unsupported arch $arch" >&2; exit 1 ;; esac
url="https://github.com/gianlucasb/hallucinator/releases/latest/download/hallucinator-cli-$tgt.tar.xz"
mkdir -p .bin
curl -fsSL "$url" -o /tmp/hcli.tar.xz
curl -fsSL "$url.sha256" -o /tmp/hcli.tar.xz.sha256
[ "$(cut -d' ' -f1 /tmp/hcli.tar.xz.sha256)" = "$(shasum -a 256 /tmp/hcli.tar.xz | cut -d' ' -f1)" ] || { echo "checksum mismatch" >&2; exit 1; }
tar -xf /tmp/hcli.tar.xz -C /tmp
cp "/tmp/hallucinator-cli-$tgt/hallucinator-cli" .bin/ && chmod +x .bin/hallucinator-cli
echo "installed .bin/hallucinator-cli $(./.bin/hallucinator-cli --version)"
"""

[tasks.build-dblp]
description = "Build the offline DBLP database at ~/hallucite/dblp.db (one-time; ~4.6 GB, ~20-30 min)"
run = '.bin/hallucinator-cli update-dblp "${HALLUCITE_DBLP:-$HOME/hallucite/dblp.db}"'

[tasks.audit]
# The script's own defaults already cover --dblp ($HALLUCITE_DBLP, else ~/hallucite/dblp.db) and
# --out (out), so everything after `--` is forwarded as-is and flags like --offline work.
description = "Stages 1+2: extract + verify references. Usage: mise run audit -- <pdf-file-or-dir> [options]"
run = "python skills/hallucite/scripts/audit_references.py"

[tasks.lint-md]
description = "Lint the repo's Markdown with the vendored PyMarkdown (skills/hallucite/scripts/lint_markdown.py). Set MD_FIX=1 to auto-fix in place."
run = """
set -euo pipefail
rc=0
for f in $(git ls-files '*.md' | grep -vE '/_vendor/|/bundled_licenses/'); do
  python skills/hallucite/scripts/lint_markdown.py ${MD_FIX:+--fix} "$f" || rc=1
done
exit $rc
"""
