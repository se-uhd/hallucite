# mise config for the hallucite reference-audit pipeline (https://mise.jdx.dev).
#
# This repo is both the runnable project (these tasks) and a Claude Code/Codex CLI plugin. Run
# mise tasks from the repo root. Layout:
#
#   hallucite/                  # repo root (also the shared plugin tree)
#   ├── mise.toml  requirements.txt
#   ├── .claude-plugin/         # Claude Code plugin.json + marketplace.json
#   ├── .codex-plugin/          # Codex CLI plugin.json
#   ├── .agents/                # Codex CLI marketplace + repo-local skill shim
#   ├── skills/hallucite/
#   │   ├── SKILL.md
#   │   └── scripts/            # pdf_references, audit_references, triage
#   └── out/                    # (gitignored) per-paper JSON, summary.json, reports/
#
# The offline DBLP DB defaults to ~/hallucite/dblp.db, outside the repo (it is large and not
# committed); override the location with $HALLUCITE_DBLP. `audit` checks the database's age at
# run time and warns when it is out of date.

[tools]
# The pipeline is standard library only and runs on 3.10 or newer; the pin just keeps a dev clone
# on one version, and matches what the recording in ~/hallucite/cases.json was made under.
python = "3.12"
uv = "latest"

[env]
# Auto-create and activate the repo's .venv whenever mise loads this dir.
_.python.venv = { path = ".venv", create = true }
# API keys for the online verification backends, if this clone has any. Gitignored, optional, and
# read by run.sh as well, so the mise tasks and the installed plugin see the same values.
_.file = { path = ".env.local", redact = true }

[tasks.install]
description = "Install Python dependencies into the venv"
run = "uv pip install -r requirements.txt"

[tasks.fetch-dblp-dump]
description = "Download dblp.xml.gz with a real browser (dblp.org fronts it with a bot challenge)"
# Needs Playwright and a display: Anubis refuses the headless browser outright, while a headed one
# completes the proof-of-work normally. Writes beside $HALLUCITE_DBLP by default.
run = "python skills/hallucite/scripts/fetch_dblp_dump.py"

[tasks.build-dblp]
description = "Build the offline DBLP database at ~/hallucite/dblp.db from the dump (~4 min)"
# Builds to a scratch file and swaps only after the result is checked, because a mirror that is
# wrong in either of the two ways that matter looks right from the outside: the publication counts
# and the titles are fine whether or not the download returned the dump, and whether or not the
# ingest kept the authors whose names carry a diacritic. Every DBLP lookup then silently misses, or
# silently disagrees with correctly cited references.
run = """
set -euo pipefail
DEST="${HALLUCITE_DBLP:-$HOME/hallucite/dblp.db}"
TMP="$DEST.building"
DUMP="${DBLP_XML_GZ:-$HOME/hallucite/dblp.xml.gz}"
rm -f "$TMP"
if [ ! -r "$DUMP" ]; then
  echo "build-dblp: no dump at $DUMP -- get it with 'mise run fetch-dblp-dump', or set" >&2
  echo "build-dblp: DBLP_XML_GZ to one you already have." >&2
  exit 1
fi
python skills/hallucite/scripts/build_dblp.py "$DUMP" --out "$TMP"
pubs=$(sqlite3 "$TMP" 'SELECT COUNT(*) FROM publications;')
if [ "$pubs" -lt 1000000 ]; then
  echo "build-dblp: only $pubs publication(s) -- that dump is not the dump." >&2
  echo "build-dblp: keeping the existing database; the failed build is at $TMP" >&2
  exit 1
fi
accented=$(sqlite3 "$TMP" "SELECT COUNT(*) FROM (SELECT name FROM authors LIMIT 400000) WHERE name GLOB '*[^ -~]*';")
if [ "$accented" -eq 0 ]; then
  echo "build-dblp: no author name carries a diacritic -- the ingest mangled the dump's character" >&2
  echo "build-dblp: entities. Keeping the existing database; the failed build is at $TMP" >&2
  exit 1
fi
# SQLite leaves -wal/-shm beside the file it built; moving only the database orphans them next to
# the scratch name and leaves the destination's stale pair in place.
rm -f "$DEST-wal" "$DEST-shm"
mv "$TMP" "$DEST"
rm -f "$TMP-wal" "$TMP-shm"
echo "build-dblp: $pubs publications, accented author names present -> $DEST"
"""

[tasks.audit]
# The script's own defaults already cover --dblp ($HALLUCITE_DBLP, else ~/hallucite/dblp.db) and
# --out (out), so everything after `--` is forwarded as-is and flags like --offline work.
description = "Stages 1+2: extract + verify references. Usage: mise run audit -- <pdf-file-or-dir> [options]"
run = "python skills/hallucite/scripts/audit_references.py"

[tasks.lint-md]
description = "Lint the repo's Markdown with the vendored PyMarkdown (skills/hallucite/scripts/lint_markdown.py). Set MD_FIX=1 to auto-fix in place."
run = """
set -euo pipefail
rc=0
for f in $(git ls-files '*.md' | grep -vE '/_vendor/|/bundled_licenses/'); do
  python skills/hallucite/scripts/lint_markdown.py ${MD_FIX:+--fix} "$f" || rc=1
done
exit $rc
"""
