# mise config for the hallucite reference-audit pipeline (https://mise.jdx.dev).
#
# This repo is both the runnable project (these tasks) and a Claude Code/Codex CLI plugin. Run
# mise tasks from the repo root. Layout:
#
#   hallucite/                  # repo root (also the shared plugin tree)
#   ├── mise.toml  requirements.txt
#   ├── .claude-plugin/         # Claude Code plugin.json + marketplace.json
#   ├── .codex-plugin/          # Codex CLI plugin.json
#   ├── .agents/                # Codex CLI marketplace + repo-local skill shim
#   ├── skills/hallucite/
#   │   ├── SKILL.md
#   │   └── scripts/            # pdf_references, audit_references, triage
#   └── out/                    # (gitignored) per-paper JSON, summary.json, reports/
#
# The offline DBLP DB defaults to ~/hallucite/dblp.db, outside the repo (it is large and not
# committed); override the location with $HALLUCITE_DBLP. `audit` checks the database's age at
# run time and warns when it is out of date.

[tools]
# hallucinator publishes wheels for CPython 3.12; pinning here avoids a
# from-source build (Rust + maturin) that 3.13 would trigger.
python = "3.12"
uv = "latest"

[env]
# Auto-create and activate the repo's .venv whenever mise loads this dir.
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install Python dependencies into the venv"
run = "uv pip install -r requirements.txt"

[tasks.upgrade]
# The repo venv and the plugin's managed venv are separate installs, so upgrade both: a dev clone
# that only bumps .venv keeps auditing through whichever one run.sh resolves. Neither updates
# itself -- see the note at the top of skills/hallucite/scripts/run.sh.
description = "Upgrade hallucinator in the repo venv and in run.sh's managed venv"
run = """
set -euo pipefail
uv pip install --upgrade hallucinator
skills/hallucite/scripts/run.sh upgrade
"""

[tasks.install-cli]
description = "Download the hallucinator CLI prebuilt binary into .bin/ (checksum-verified, no curl|sh)"
# Refuses to clobber a build carrying dblp-entity-fix.patch. The stock binary drops every author
# whose name has a diacritic, and the loss is invisible downstream -- publication counts, titles
# and record keys all look right -- so overwriting a patched binary here would silently reintroduce
# it. `mise run install-cli-patched` is the one to use; FORCE=1 overrides.
run = """
set -euo pipefail
if [ -x .bin/hallucinator-cli ] && ./.bin/hallucinator-cli update-dblp --help 2>/dev/null | grep -q -- --from-file; then
  if [ "${FORCE:-0}" != "1" ]; then
    echo "install-cli: .bin/hallucinator-cli carries dblp-entity-fix.patch; the stock binary would" >&2
    echo "install-cli: drop every author whose name has a diacritic. Use 'mise run install-cli-patched'," >&2
    echo "install-cli: or FORCE=1 to overwrite anyway." >&2
    exit 1
  fi
  echo "install-cli: FORCE=1 -- replacing the patched binary with the stock one" >&2
fi
os=$(uname -s); [ "$os" = "Darwin" ] || { echo "install-cli fetches macOS (Darwin) binaries only; on $os install with 'cargo install hallucinator-cli' or download from the releases page" >&2; exit 1; }
arch=$(uname -m); case "$arch" in arm64|aarch64) tgt=aarch64-apple-darwin ;; x86_64) tgt=x86_64-apple-darwin ;; *) echo "unsupported arch $arch" >&2; exit 1 ;; esac
url="https://github.com/gianlucasb/hallucinator/releases/latest/download/hallucinator-cli-$tgt.tar.xz"
mkdir -p .bin
curl -fsSL "$url" -o /tmp/hcli.tar.xz
curl -fsSL "$url.sha256" -o /tmp/hcli.tar.xz.sha256
[ "$(cut -d' ' -f1 /tmp/hcli.tar.xz.sha256)" = "$(shasum -a 256 /tmp/hcli.tar.xz | cut -d' ' -f1)" ] || { echo "checksum mismatch" >&2; exit 1; }
tar -xf /tmp/hcli.tar.xz -C /tmp
cp "/tmp/hallucinator-cli-$tgt/hallucinator-cli" .bin/ && chmod +x .bin/hallucinator-cli
echo "installed .bin/hallucinator-cli $(./.bin/hallucinator-cli --version)"
"""

[tasks.fetch-dblp-dump]
description = "Download dblp.xml.gz with a real browser (dblp.org fronts it with a bot challenge)"
# Needs Playwright and a display: Anubis refuses the headless browser outright, while a headed one
# completes the proof-of-work normally. Writes beside $HALLUCITE_DBLP by default.
run = "python skills/hallucite/scripts/fetch_dblp_dump.py"

[tasks.install-cli-patched]
description = "Build hallucinator-cli from source with dblp-entity-fix.patch applied, into .bin/"
# The released binary mangles DBLP's character entities: quick-xml's unescape() is built without
# the `escape-html` feature, so a name like `M&aacute;rcio Ribeiro` fails to resolve, the parser
# drops the whole text chunk, and the author is never recorded. dblp-entity-fix.patch fixes that
# and adds `update-dblp --from-file`, needed because dblp.org fronts the dump with a bot check.
run = """
set -euo pipefail
ver="${HALLUCINATOR_VERSION:-0.2.3}"
command -v cargo >/dev/null || { echo "install-cli-patched needs a Rust toolchain (https://rustup.rs)" >&2; exit 1; }
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
curl -fsSL "https://github.com/gianlucasb/hallucinator/releases/download/v$ver/source.tar.gz" -o "$work/src.tar.gz"
tar xzf "$work/src.tar.gz" -C "$work"
src="$(find "$work" -maxdepth 1 -type d -name 'hallucinator-*' | head -1)"
patch -p1 -d "$src" < dblp-entity-fix.patch
( cd "$src" && cargo build --release -p hallucinator-cli )
mkdir -p .bin
cp "$src/target/release/hallucinator-cli" .bin/hallucinator-cli
chmod +x .bin/hallucinator-cli
./.bin/hallucinator-cli update-dblp --help | grep -q -- --from-file \
  || { echo "install-cli-patched: built binary lacks --from-file; patch did not apply" >&2; exit 1; }
echo "installed patched .bin/hallucinator-cli $(./.bin/hallucinator-cli --version)"
"""

[tasks.build-dblp]
description = "Build the offline DBLP database at ~/hallucite/dblp.db (one-time; ~4.6 GB, ~20-30 min)"
# Builds to a scratch file and swaps only after the result is checked. `update-dblp` writes a
# database and exits 0 even when the download returned a bot-check HTML page instead of the dump,
# so writing straight to the real path replaces a working 2.6 GB mirror with an empty one and says
# nothing. Every DBLP lookup then silently misses.
run = """
set -euo pipefail
DEST="${HALLUCITE_DBLP:-$HOME/hallucite/dblp.db}"
TMP="$DEST.building"
rm -f "$TMP"
# DBLP_XML_GZ points at a dump already on disk, for when dblp.org answers with its
# proof-of-work bot check instead of the file (see README).
if [ -n "${DBLP_XML_GZ:-}" ]; then
  .bin/hallucinator-cli update-dblp "$TMP" --from-file "$DBLP_XML_GZ"
else
  .bin/hallucinator-cli update-dblp "$TMP"
fi
pubs=$(sqlite3 "$TMP" 'SELECT COUNT(*) FROM publications;')
if [ "$pubs" -lt 1000000 ]; then
  echo "build-dblp: only $pubs publication(s) -- the download did not return the dump." >&2
  echo "build-dblp: keeping the existing database; the failed build is at $TMP" >&2
  exit 1
fi
accented=$(sqlite3 "$TMP" "SELECT COUNT(*) FROM (SELECT name FROM authors LIMIT 400000) WHERE name GLOB '*[^ -~]*';")
if [ "$accented" -eq 0 ]; then
  echo "build-dblp: no author name carries a diacritic -- this hallucinator-cli mangles the" >&2
  echo "build-dblp: dump's character entities. Keeping the existing database; build at $TMP" >&2
  exit 1
fi
# SQLite leaves -wal/-shm beside the file it built; moving only the database orphans them next to
# the scratch name and leaves the destination's stale pair in place.
rm -f "$DEST-wal" "$DEST-shm"
mv "$TMP" "$DEST"
rm -f "$TMP-wal" "$TMP-shm"
echo "build-dblp: $pubs publications, accented author names present -> $DEST"
"""

[tasks.audit]
# The script's own defaults already cover --dblp ($HALLUCITE_DBLP, else ~/hallucite/dblp.db) and
# --out (out), so everything after `--` is forwarded as-is and flags like --offline work.
description = "Stages 1+2: extract + verify references. Usage: mise run audit -- <pdf-file-or-dir> [options]"
run = "python skills/hallucite/scripts/audit_references.py"

[tasks.lint-md]
description = "Lint the repo's Markdown with the vendored PyMarkdown (skills/hallucite/scripts/lint_markdown.py). Set MD_FIX=1 to auto-fix in place."
run = """
set -euo pipefail
rc=0
for f in $(git ls-files '*.md' | grep -vE '/_vendor/|/bundled_licenses/'); do
  python skills/hallucite/scripts/lint_markdown.py ${MD_FIX:+--fix} "$f" || rc=1
done
exit $rc
"""
